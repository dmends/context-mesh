  <style>
    :root,
    [data-theme="dark"] {
      color-scheme: dark;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      /* Core Dark Palette */
      --bg-canvas: #0b0f17;
      --bg-canvas-accent-1: rgba(30, 58, 138, 0.22);
      --bg-canvas-accent-2: rgba(14, 165, 233, 0.05);
      --bg-header: rgba(15, 21, 34, 0.92);
      --bg-surface: #111827;
      --bg-surface-elevated: #161f30;
      --bg-surface-hover: #1e293b;
      --bg-input: #0e1420;
      --bg-blueprint: #0b101b;
      --grid-line: rgba(148, 163, 184, 0.06);
      --bg-code: #070a10;
      --text-code: #e2e8f0;
      --bg-overlay: rgba(3, 7, 18, 0.72);

      /* Borders & Glows */
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.28);
      --border-focus: #38bdf8;

      /* Text Hierarchy */
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --logo-color: #f8fafc;

      /* Theme Header & Blueprint Tokens */
      --theme-header-bg: linear-gradient(180deg, rgba(26, 36, 54, 0.75) 0%, rgba(17, 24, 39, 0.9) 100%);
      --theme-header-hover: rgba(30, 41, 59, 0.85);
      --badge-tema-bg: rgba(37, 99, 235, 0.14);
      --badge-tema-text: #60a5fa;
      --badge-tema-border: rgba(59, 130, 246, 0.35);
      --connector-stroke: #64748b;
      --connector-active: #38bdf8;
      --separator-stroke: rgba(148, 163, 184, 0.32);

      /* Metric Cards */
      --metric-bg: linear-gradient(165deg, rgba(22, 31, 48, 0.92) 0%, rgba(15, 23, 42, 0.96) 100%);
      --metric-label-color: #e2e8f0;
      --status-done-border: rgba(16, 185, 129, 0.45);
      --status-done-bg: rgba(16, 185, 129, 0.12);
      --status-done-text: #34d399;
      --status-done-glow: rgba(16, 185, 129, 0.12);

      --status-active-border: rgba(56, 189, 248, 0.48);
      --status-active-bg: rgba(56, 189, 248, 0.12);
      --status-active-text: #38bdf8;
      --status-active-glow: rgba(56, 189, 248, 0.14);

      --status-waiting-border: rgba(245, 158, 11, 0.45);
      --status-waiting-bg: rgba(245, 158, 11, 0.12);
      --status-waiting-text: #fbbf24;
      --status-waiting-glow: rgba(245, 158, 11, 0.12);

      --status-error-border: rgba(244, 63, 94, 0.45);
      --status-error-bg: rgba(244, 63, 94, 0.12);
      --status-error-text: #fb7185;
      --status-error-glow: rgba(244, 63, 94, 0.12);

      /* Step Nodes */
      --node-bg: linear-gradient(180deg, #162033 0%, #111827 100%);
      --node-hover-bg: linear-gradient(180deg, #1b2840 0%, #151e30 100%);
      --node-border: rgba(59, 130, 246, 0.28);
      --node-hover-border: rgba(96, 165, 250, 0.65);
      --node-title: #f1f5f9;
      --node-shadow: 0 4px 14px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --node-hover-shadow: 0 8px 24px rgba(2, 6, 23, 0.65), 0 0 0 1px rgba(56, 189, 248, 0.25);
      --node-num-bg: rgba(37, 99, 235, 0.2);
      --node-num-border: rgba(59, 130, 246, 0.3);
      --node-num-text: #60a5fa;
      --node-badge-bg: rgba(30, 41, 59, 0.9);
      --node-badge-border: rgba(148, 163, 184, 0.18);
      --node-badge-text: #cbd5e1;

      /* Shadows & Radii */
      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.45), 0 0 1px 0 rgba(255, 255, 255, 0.05);
      --shadow-modal: 0 25px 60px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(148, 163, 184, 0.18);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 18px;
    }

    [data-theme="light"] {
      color-scheme: light;

      /* Core Light Palette */
      --bg-canvas: #f4f7fb;
      --bg-canvas-accent-1: rgba(37, 99, 235, 0.06);
      --bg-canvas-accent-2: rgba(14, 165, 233, 0.04);
      --bg-header: rgba(255, 255, 255, 0.92);
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f8fafc;
      --bg-surface-hover: #f1f5f9;
      --bg-input: #f8fafc;
      --bg-blueprint: #f8fafc;
      --grid-line: rgba(148, 163, 184, 0.16);
      --bg-code: #0f172a;
      --text-code: #f8fafc;
      --bg-overlay: rgba(15, 23, 42, 0.38);

      /* Borders & Glows */
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --border-focus: #2563eb;

      /* Text Hierarchy */
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --logo-color: #0f172a;

      /* Theme Header & Blueprint Tokens */
      --theme-header-bg: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      --theme-header-hover: #f1f5f9;
      --badge-tema-bg: #eff6ff;
      --badge-tema-text: #1d4ed8;
      --badge-tema-border: #bfdbfe;
      --connector-stroke: #94a3b8;
      --connector-active: #2563eb;
      --separator-stroke: #cbd5e1;

      /* Metric Cards */
      --metric-bg: #ffffff;
      --metric-label-color: #334155;
      --status-done-border: #86efac;
      --status-done-bg: #dcfce7;
      --status-done-text: #16a34a;
      --status-done-glow: rgba(22, 163, 74, 0.08);

      --status-active-border: #93c5fd;
      --status-active-bg: #dbeafe;
      --status-active-text: #2563eb;
      --status-active-glow: rgba(37, 99, 235, 0.08);

      --status-waiting-border: #fcd34d;
      --status-waiting-bg: #fef3c7;
      --status-waiting-text: #d97706;
      --status-waiting-glow: rgba(217, 119, 6, 0.08);

      --status-error-border: #fda4af;
      --status-error-bg: #ffe4e6;
      --status-error-text: #e11d48;
      --status-error-glow: rgba(225, 29, 72, 0.08);

      /* Step Nodes */
      --node-bg: #ffffff;
      --node-hover-bg: #ffffff;
      --node-border: #cbd5e1;
      --node-hover-border: #3b82f6;
      --node-title: #0f172a;
      --node-shadow: 0 2px 6px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
      --node-hover-shadow: 0 10px 22px -4px rgba(15, 23, 42, 0.1), 0 0 0 1px rgba(59, 130, 246, 0.3);
      --node-num-bg: #eff6ff;
      --node-num-border: #bfdbfe;
      --node-num-text: #1d4ed8;
      --node-badge-bg: #f1f5f9;
      --node-badge-border: #e2e8f0;
      --node-badge-text: #475569;

      /* Shadows & Radii */
      --shadow-card: 0 2px 10px -1px rgba(15, 23, 42, 0.05), 0 1px 3px 0 rgba(15, 23, 42, 0.03);
      --shadow-modal: 0 24px 60px -12px rgba(15, 23, 42, 0.22), 0 0 0 1px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(ellipse 80% 45% at 50% -15%, var(--bg-canvas-accent-1), transparent),
        radial-gradient(circle at 85% 20%, var(--bg-canvas-accent-2), transparent 40%);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    main#content {
      padding: 24px 32px 72px;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    p {
      line-height: 1.5;
    }

    input, select, button {
      max-width: 100%;
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    /* ── Top Navigation Header (Edge-to-Edge) ── */
    .intro {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      width: 100%;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-subtle);
      border-radius: 0;
      padding: 10px 32px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .intro-main {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .intro-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-right: auto;
    }

    .intro-logo {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      color: var(--logo-color);
      transition: color 0.2s ease;
    }

    .intro-title {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .intro-title h1 {
      font-size: 1.05rem;
      letter-spacing: -0.03em;
      font-weight: 750;
      color: var(--text-primary);
      line-height: 1.15;
    }

    .intro-title p {
      color: var(--text-muted);
      font-size: 0.72rem;
      line-height: 1.2;
      margin-top: 1px;
    }

    .controls {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .field {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    .field-label {
      color: var(--text-muted);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── Buttons (Compact 34px Header Scale) ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 0 12px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      line-height: 1;
      height: 34px;
    }

    .btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      padding: 0;
    }

    .btn-primary {
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border-color: rgba(96, 165, 250, 0.4);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .btn-primary:hover {
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }

    .btn-secondary {
      background: var(--bg-surface-elevated);
      color: var(--text-secondary);
      border-color: var(--border-subtle);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .btn-secondary:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .btn:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    /* ── Theme Toggle Icons ── */
    [data-theme="dark"] .icon-sun { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="light"] .icon-sun { display: none; }
    [data-theme="light"] .icon-moon { display: block; }

    /* ── Select Control (Compact 34px) ── */
    .select-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .select-wrap svg {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-secondary);
      width: 14px;
      height: 14px;
    }

    select#initiative {
      appearance: none;
      -webkit-appearance: none;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 0 32px 0 11px;
      height: 34px;
      font-size: 0.76rem;
      font-weight: 500;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background-color 0.2s;
      min-width: 220px;
    }

    select#initiative:hover:not(:disabled) {
      border-color: var(--border-strong);
    }

    select#initiative:disabled {
      opacity: 0.6;
      cursor: default;
    }

    select#initiative:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    select option {
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    /* ── Feedback Messages ── */
    .feedback-bar {
      padding: 0 32px;
    }

    .msg {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      margin-top: 14px;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
    }

    #message {
      color: #fda4af;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    [data-theme="light"] #message {
      color: #be123c;
      background: #fff1f2;
      border-color: #fecdd3;
    }

    #notice {
      color: #7dd3fc;
      background: rgba(14, 165, 233, 0.1);
      border: 1px solid rgba(14, 165, 233, 0.25);
    }

    [data-theme="light"] #notice {
      color: #0369a1;
      background: #f0f9ff;
      border-color: #bae6fd;
    }

    #message:empty, #notice:empty {
      display: none;
    }

    /* ── Overview & Status Cards ── */
    .overview {
      margin: 0 0 20px;
    }

    .overview-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .overview h2 {
      font-size: 1.25rem;
      letter-spacing: -0.03em;
      font-weight: 750;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .overview h2 span.run-id-tag {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      background: var(--metric-bg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .metric:hover {
      transform: translateY(-2px);
    }

    .metric.done {
      border-color: var(--status-done-border);
      box-shadow: 0 4px 18px -4px var(--status-done-glow);
    }

    .metric.active {
      border-color: var(--status-active-border);
      box-shadow: 0 4px 18px -4px var(--status-active-glow);
    }

    .metric.waiting {
      border-color: var(--status-waiting-border);
      box-shadow: 0 4px 18px -4px var(--status-waiting-glow);
    }

    .metric.error {
      border-color: var(--status-error-border);
      box-shadow: 0 4px 18px -4px var(--status-error-glow);
    }

    .metric-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .metric-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .metric-icon svg {
      width: 16px;
      height: 16px;
    }

    .metric-icon.done {
      background: var(--status-done-bg);
      color: var(--status-done-text);
    }

    .metric-icon.active {
      background: var(--status-active-bg);
      color: var(--status-active-text);
    }

    .metric-icon.waiting {
      background: var(--status-waiting-bg);
      color: var(--status-waiting-text);
    }

    .metric-icon.error {
      background: var(--status-error-bg);
      color: var(--status-error-text);
    }

    .metric-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--metric-label-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .metric.done .metric-value { color: var(--status-done-text); }
    .metric.active .metric-value { color: var(--status-active-text); }
    .metric.waiting .metric-value { color: var(--status-waiting-text); }
    .metric.error .metric-value { color: var(--status-error-text); }

    /* ── Theme / Workflow Panel ── */
    .theme {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      margin: 0 0 22px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .theme-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid transparent;
      background: var(--theme-header-bg);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .theme-header:hover {
      background: var(--theme-header-hover);
    }

    .theme.open .theme-header {
      border-bottom-color: var(--border-subtle);
    }

    .theme-header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .theme-header h2 {
      font-size: 1.02rem;
      letter-spacing: -0.02em;
      font-weight: 700;
      color: var(--text-primary);
    }

    .theme-header p {
      color: var(--text-secondary);
      font-size: 0.76rem;
    }

    .theme-header-right {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .theme-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--badge-tema-bg);
      color: var(--badge-tema-text);
      border: 1px solid var(--badge-tema-border);
    }

    .theme-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      color: var(--text-secondary);
      transition: transform 0.2s ease, background 0.15s ease, color 0.15s ease;
    }

    .theme-header:hover .theme-chevron {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text-primary);
    }

    .theme-chevron svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .theme.open .theme-chevron {
      transform: rotate(180deg);
    }

    /* ── Blueprint Graph Area ── */
    .graph-scroll {
      display: none;
      overflow-x: auto;
      padding: 24px 28px 32px;
      background-color: var(--bg-blueprint);
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 24px 24px;
      transition: background-color 0.2s ease;
    }

    .theme.open .graph-scroll {
      display: block;
    }

    .graph {
      position: relative;
    }

    .connections {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }

    .phase-label {
      position: absolute;
      top: 10px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      pointer-events: none;
      text-align: center;
    }

    .connections path {
      fill: none;
      stroke: var(--connector-stroke);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }

    .connections path.active {
      stroke: var(--connector-active);
    }

    /* ── Step Nodes ── */
    .step {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      color: var(--text-secondary);
      border: 1px solid var(--node-border);
      border-radius: var(--radius-md);
      background: var(--node-bg);
      padding: 10px 12px;
      overflow-wrap: anywhere;
      box-shadow: var(--node-shadow);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      user-select: none;
    }

    .step:hover {
      background: var(--node-hover-bg);
      border-color: var(--node-hover-border);
      box-shadow: var(--node-hover-shadow);
      transform: translateY(-2px);
    }

    .step:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .step.done {
      border-color: var(--status-done-border);
    }

    .step.active {
      border-color: var(--status-active-border);
      animation: pulse-node 2.4s ease-in-out infinite;
    }

    .step.recorded {
      border-color: var(--status-done-border);
    }

    .step.error {
      border-color: var(--status-error-border);
    }

    @keyframes pulse-node {
      0%, 100% { box-shadow: var(--node-shadow), 0 0 0 0 rgba(56, 189, 248, 0); }
      50% { box-shadow: var(--node-shadow), 0 0 0 4px rgba(56, 189, 248, 0.16); }
    }

    .step-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
    }

    .step h3 {
      font-size: 0.76rem;
      line-height: 1.25;
      font-weight: 650;
      color: var(--node-title);
      margin: 0;
    }

    .step-number {
      flex-shrink: 0;
      min-width: 20px;
      height: 18px;
      padding: 0 5px;
      border-radius: 5px;
      background: var(--node-num-bg);
      border: 1px solid var(--node-num-border);
      color: var(--node-num-text);
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step.done .step-number {
      background: var(--status-done-bg);
      border-color: var(--status-done-border);
      color: var(--status-done-text);
    }

    .step.error .step-number {
      background: var(--status-error-bg);
      border-color: var(--status-error-border);
      color: var(--status-error-text);
    }

    .step-footer {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
    }

    /* ── Status Badges inside Cards ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
      background: var(--node-badge-bg);
      border: 1px solid var(--node-badge-border);
      color: var(--node-badge-text);
    }

    .status-badge span {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-badge .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-badge.waiting .dot {
      background: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.7);
    }

    .status-badge.done {
      background: var(--status-done-bg);
      border-color: var(--status-done-border);
      color: var(--status-done-text);
    }

    .status-badge.done .dot {
      background: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.7);
    }

    .status-badge.active {
      background: var(--status-active-bg);
      border-color: var(--status-active-border);
      color: var(--status-active-text);
    }

    .status-badge.active .dot {
      background: #38bdf8;
      animation: blink 1s ease-in-out infinite;
    }

    .status-badge.recorded {
      background: var(--status-done-bg);
      border-color: var(--status-done-border);
      color: var(--status-done-text);
    }

    .status-badge.recorded .dot {
      background: #34d399;
      animation: blink 1s ease-in-out infinite;
    }

    .status-badge.error {
      background: var(--status-error-bg);
      border-color: var(--status-error-border);
      color: var(--status-error-text);
    }

    .status-badge.error .dot {
      background: #f43f5e;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .step:active {
      transform: translateY(0);
    }

    /* ── Details Modal / Drawer ── */
    #details {
      position: fixed;
      z-index: 100;
      left: 50%;
      transform: translateX(-50%);
      top: 32px;
      width: min(1240px, calc(100% - 32px));
      max-height: calc(100vh - 64px);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-modal);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modal-in 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translate(-50%, 10px) scale(0.99); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    .details-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-surface-elevated);
      flex-shrink: 0;
    }

    .details-topbar h2 {
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .details-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 22px 24px;
    }

    .detail-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .detail-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .artifacts-heading {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    /* ── Artifact Accordion ── */
    .artifact {
      margin-bottom: 14px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-input);
      overflow: hidden;
    }

    .artifact-header {
      padding: 11px 16px;
      background: var(--bg-surface-elevated);
      border-bottom: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .artifact-header:hover {
      background: var(--bg-surface-hover);
    }

    .artifact.open .artifact-header {
      border-bottom-color: var(--border-subtle);
    }

    .artifact-header strong {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .artifact-path {
      color: var(--text-muted);
      font-size: 0.74rem;
      font-family: var(--font-mono);
      overflow-wrap: anywhere;
      flex: 1;
    }

    .artifact-chevron {
      flex-shrink: 0;
      color: var(--text-secondary);
      transition: transform 0.2s ease;
      line-height: 0;
    }

    .artifact-chevron svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    .artifact.open .artifact-chevron {
      transform: rotate(180deg);
    }

    .artifact-body {
      padding: 16px;
      display: none;
    }

    .artifact.open .artifact-body {
      display: block;
    }

    .artifact pre {
      background: var(--bg-code);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 16px;
      color: var(--text-code);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 0.8rem/1.65 var(--font-mono);
      margin: 0;
    }

    .artifact-loading {
      color: var(--text-secondary);
      font-size: 0.82rem;
    }

    .artifact-error {
      font-size: 0.8rem;
      color: var(--status-error-text);
      background: var(--status-error-bg);
      border: 1px solid var(--status-error-border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
    }

    .engine-error-banner {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-bottom: 16px;
      padding: 12px 14px;
      background: var(--status-waiting-bg);
      border: 1px solid var(--status-waiting-border);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      color: var(--status-waiting-text);
    }

    .empty-artifacts {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
      gap: 10px;
      background: var(--bg-input);
      border: 1px dashed var(--border-subtle);
      border-radius: var(--radius-md);
    }

    /* ── Markdown Content ── */
    .markdown {
      color: var(--text-secondary);
      font-size: 0.88rem;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .markdown h1, .markdown h2, .markdown h3, .markdown h4 {
      color: var(--text-primary);
      margin: 1.2em 0 0.5em;
      line-height: 1.3;
      font-weight: 700;
    }

    .markdown h1 { font-size: 1.18rem; }
    .markdown h2 { font-size: 1.02rem; }
    .markdown h3 { font-size: 0.92rem; }

    .markdown p, .markdown ul, .markdown ol, .markdown blockquote, .markdown table {
      margin: 0.7em 0;
    }

    .markdown blockquote {
      border-left: 3px solid var(--border-focus);
      padding-left: 14px;
      color: var(--text-secondary);
    }

    .markdown table {
      display: block;
      overflow-x: auto;
      border-collapse: collapse;
      width: 100%;
    }

    .markdown th, .markdown td {
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      text-align: left;
    }

    .markdown th {
      background: var(--bg-surface-elevated);
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--text-primary);
    }

    .markdown code {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.82em;
      font-family: var(--font-mono);
      color: var(--badge-tema-text);
    }

    .markdown pre code {
      background: none;
      border: none;
      padding: 0;
      color: inherit;
    }

    /* ── Overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      z-index: 99;
      backdrop-filter: blur(4px);
      animation: fade-in 0.15s ease;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ── Read-only Item Cards ── */

    .sources-grid {

      margin-top: 16px;

      border-radius: var(--radius-md);
      padding: 16px;
      background: var(--bg-input);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

      background: var(--status-waiting-bg);
      color: var(--status-waiting-text);
      border: 1px solid var(--status-waiting-border);
    }

    .source-badge.target {
      background: var(--status-done-bg);
      color: var(--status-done-text);
      border: 1px solid var(--status-done-border);
    }

    .source-badge.reference {
      background: rgba(168, 85, 247, 0.14);
      color: #a855f7;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }

    .source-badge.integration {
      background: var(--status-active-bg);
      color: var(--status-active-text);
      border: 1px solid var(--status-active-border);
    }

    .source-badge.documentation {
      background: var(--node-badge-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }

    .source-path {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--badge-tema-text);
      overflow-wrap: anywhere;
    }

    .source-kind, .source-stack, .source-scope, .artifact-group {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .source-description {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .sources-empty {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .source-form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }

    .source-form input, .source-form select {
      min-width: 180px;
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
    }

    .source-form input:focus, .source-form select:focus {
      outline: none;
      border-color: var(--border-focus);
    }

    .source-output {
      flex-basis: 100%;

        typeof state.runId === 'string' && Array.isArray(state.sources) && Array.isArray(state.nodes);
      if (!valid) throw new Error('Estado inválido ou incompatível: esperado Schema 1 com fontes e nós em arrays.');

      const sourcesValid = state.sources.every((source) => source && typeof source.id === 'string' &&
        typeof source.path === 'string' && ['repository', 'document'].includes(source.kind) &&
        ['legacy', 'target', 'reference', 'integration', 'documentation'].includes(source.role) &&
        ['stack', 'scope', 'description'].every((field) => source[field] === undefined || typeof source[field] === 'string'));
      const nodesValid = state.nodes.every((node) => node && typeof node.id === 'string' &&
        typeof node.tema === 'string' && Array.isArray(node.steps) && node.steps.every((step) =>
          step && typeof step.type === 'string' && typeof step.name === 'string' &&
          validStatuses.has(step.status) && Array.isArray(step.artifacts) &&
          step.artifacts.every(validateArtifact) && Array.isArray(step.items) &&
          step.items.every((item) => item && typeof item.id === 'string' &&
            typeof item.label === 'string' && validStatuses.has(item.status) &&
            Array.isArray(item.artifacts) && item.artifacts.every(validateArtifact)) &&
          (step.approvedArtifacts === undefined || (Array.isArray(step.approvedArtifacts) &&
            step.approvedArtifacts.every((approved) => approved && typeof approved.stepType === 'string' &&
              Array.isArray(approved.artifacts) && approved.artifacts.every(validateArtifact))))) &&
        steps.every((definition) => node.steps.some((step) => step.type === definition.id)));
      if (!sourcesValid || !nodesValid) {
        throw new Error('Estado inválido: fontes, nós, etapas, status ou artefatos não seguem o Schema 1.');
      }
    }

    function statusBadge(status) {
      const definition = statuses[status];
      const badge = element('span', '', `status-badge ${definition.className}`);
      badge.append(element('span', '', 'dot'), element('span', definition.label));
      return badge;
    }

    function rankSteps() {
      const ranks = new Map();
      for (const step of steps) {
        const dependencyRanks = step.requires.map((id) => ranks.get(id));
        ranks.set(step.id, dependencyRanks.length ? Math.max(...dependencyRanks) + 1 : 0);
      }
      return ranks;
    }

    function diagram(node) {
      const cardWidth = 158;
      const cardHeight = 76;
      const columnWidth = 192;
      const rowHeight = cardHeight * 1.9;
      const ranks = rankSteps();
      const byRank = new Map();
      for (const step of steps) {
        const rank = ranks.get(step.id);
        if (!byRank.has(rank)) byRank.set(rank, []);
        byRank.get(rank).push(step);
      }
      const maxRank = Math.max(...ranks.values());
      const maxParallel = Math.max(...[...byRank.values()].map((group) => group.length), 2);
      const width = maxRank * columnWidth + cardWidth + 16;
      const height = maxParallel * rowHeight + 68;
      const centerY = (height - cardHeight) / 2 + 12;
      const topY = Math.round((height - cardHeight - rowHeight) / 2) + 12;
      const positions = new Map();
      for (const step of steps) {
        const peers = byRank.get(ranks.get(step.id));
        positions.set(step.id, {
          x: 8 + ranks.get(step.id) * columnWidth,
          y: peers.length === 1 ? centerY : topY + peers.indexOf(step) * rowHeight,
        });
      }

      const scroll = element('div', '', 'graph-scroll');
      const graph = element('div', '', 'graph');
      graph.style.width = '100%';
      graph.style.minWidth = `${width}px`;
      graph.style.height = `${height}px`;

      const connections = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      connections.setAttribute('class', 'connections');
      connections.setAttribute('width', '100%');
      connections.setAttribute('height', height);
      connections.setAttribute('viewBox', `0 0 ${width} ${height}`);
      connections.setAttribute('preserveAspectRatio', 'none');
      connections.setAttribute('aria-hidden', 'true');

      const gateRank = ranks.get('validation-gate');
      const nextRankStep = gateRank === undefined ? null : steps.find((step) => ranks.get(step.id) === gateRank + 1);
      if (nextRankStep) {
        const separatorX = Math.round(positions.get('validation-gate').x + cardWidth / 2);
        const separator = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        separator.setAttribute('x1', separatorX);
        separator.setAttribute('y1', 8);
        separator.setAttribute('x2', separatorX);
        separator.setAttribute('y2', height - 8);
        separator.setAttribute('stroke', 'var(--separator-stroke)');
        separator.setAttribute('stroke-width', '1.5');
        separator.setAttribute('stroke-dasharray', '5 5');
        connections.append(separator);

        const percentage = `${(separatorX / width * 100).toFixed(2)}%`;
        const upstream = element('div', 'UPSTREAM', 'phase-label');
        upstream.style.cssText = `left:0;width:${percentage};`;
        const downstream = element('div', 'DOWNSTREAM', 'phase-label');
        downstream.style.cssText = `left:${percentage};right:0;`;
        graph.append(upstream, downstream);
      }

      for (const step of steps) {
        for (const dependency of step.requires) {
          const from = positions.get(dependency);
          const to = positions.get(step.id);
          const startX = from.x + cardWidth;
          const startY = from.y + cardHeight / 2;
          const endX = to.x;
          const endY = to.y + cardHeight / 2;
          const middleX = Math.round((startX + endX) / 2);
          const direction = endY >= startY ? 1 : -1;
          const tip = endX - 5;
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('data-dependency', `${dependency}:${step.id}`);
          const d = Math.abs(startY - endY) < 1
            ? `M ${startX} ${startY} H ${tip - 6} M ${tip - 6} ${endY - 4} L ${tip} ${endY} L ${tip - 6} ${endY + 4}`
            : `M ${startX} ${startY} H ${middleX - 8} Q ${middleX} ${startY} ${middleX} ${startY + direction * 8} V ${endY - direction * 8} Q ${middleX} ${endY} ${middleX + 8} ${endY} H ${tip - 6} L ${tip} ${endY} L ${tip - 6} ${endY + 4}`;
          path.setAttribute('d', d);
          connections.append(path);
        }
      }

      graph.insertBefore(connections, graph.children[0] || null);

      for (const [index, step] of steps.entries()) {
        const state = findStep(node, step.id);
        const status = statuses[state.status];
        const card = element('button', '', `step ${status.className}`);
        card.type = 'button';
        card.setAttribute('data-step', step.id);
        card.style.left = `${positions.get(step.id).x / width * 100}%`;
        card.style.top = `${positions.get(step.id).y}px`;
        card.style.width = `${cardWidth / width * 100}%`;
        card.style.height = `${cardHeight}px`;

        const heading = element('div', '', 'step-heading');
        heading.append(
          element('h3', labels[step.id] || step.id),
          element('span', String(index + 1).padStart(2, '0'), 'step-number'),
        );
        const footer = element('div', '', 'step-footer');
        footer.append(statusBadge(state.status));
        card.append(heading, footer);
        card.addEventListener('click', () => showDetails(node, step));
        graph.append(card);
      }

      scroll.append(graph);
      return scroll;
    }

    function sourceRoleLabel(role) {
      return ({
        legacy: 'Legado',
        target: 'To-Be / Target',
        reference: 'Referência',
        integration: 'Integração',
        documentation: 'Documentação',
      })[role] || 'Papel inválido';
    }

    function renderSourcesSection(state) {
      const button = element('button', '', 'btn btn-secondary btn-icon sources-button');
      button.type = 'button';
      button.title = `Fontes de Código e Insumos (${state.sources.length})`;
      button.setAttribute('aria-label', button.title);
      button.append(svgIcon('M5 3h7l4 4v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z M12 3v4h4 M7 11h6 M7 14h4'));
      button.addEventListener('click', () => showSources(state));
      return button;
    }

    function showSources(state) {
      detailSequence += 1;
      details.textContent = '';
      details.hidden = false;
      overlay.hidden = false;
      const topbar = element('div', '', 'details-topbar');
      const close = element('button', 'Fechar', 'btn btn-secondary');
      close.type = 'button';
      close.addEventListener('click', closeDetails);
      topbar.append(element('h2', `Fontes de Código e Insumos (${state.sources.length})`), close);
      details.append(topbar);
      overlay.addEventListener('click', closeDetails, { once: true });

      const scroll = element('div', '', 'details-scroll');
      const addButton = element('button', '+ Adicionar Fonte', 'btn btn-secondary');
      addButton.type = 'button';
      addButton.addEventListener('click', () => openSourceForm(scroll, state.runId));
      scroll.append(addButton);

      const grid = element('div', '', 'sources-grid');
      for (const source of state.sources) {
        const card = element('article', '', 'source-card');

        const title = element('strong', source.id);
        title.style.color = 'var(--text-primary)';
        const kind = element('span', source.kind === 'repository' ? 'Repositório' : 'Documento', 'source-kind');
        card.append(badge, title, element('code', source.path, 'source-path'), kind);
        if (source.stack) card.append(element('span', source.stack, 'source-stack'));
        if (source.scope) card.append(element('span', `scope: ${source.scope}`, 'source-scope'));
        if (source.description) card.append(element('p', source.description, 'source-description'));
        grid.append(card);
      }
      if (!state.sources.length) grid.append(element('p', 'Nenhuma fonte registrada nesta iniciativa.', 'sources-empty'));
      scroll.append(grid);
      details.append(scroll);
    }

    function openSourceForm(section, runId) {
      section.querySelector('.source-form')?.remove();
      const form = element('form', '', 'source-form');
      const fields = [
        ['id', 'Identificador', 'ex: monolito-core'],
        ['path', 'Caminho relativo', 'workspace/src/monolito-core'],
        ['stack', 'Stack (opcional)', 'Java 8 / Spring 4'],
        ['scope', 'Escopo (opcional)', 'src/main/java'],
        ['description', 'Descrição (opcional)', 'Propósito da fonte'],
      ];
      const inputs = {};
      for (const [key, label, placeholder] of fields) {
        const input = element('input');
        input.name = key;
        input.placeholder = placeholder;
        input.setAttribute('aria-label', label);
        inputs[key] = input;
        form.append(input);
      }
      const kind = element('select');
      kind.name = 'kind';
      for (const value of ['repository', 'document']) {
        const option = element('option', value === 'repository' ? 'Repositório' : 'Documento');
        option.value = value;
        kind.append(option);
      }
      const role = element('select');
      role.name = 'role';
      for (const value of ['legacy', 'target', 'reference', 'integration', 'documentation']) {
        const option = element('option', sourceRoleLabel(value));
        option.value = value;
        role.append(option);
      }
      form.append(kind, role);
      const output = element('pre', '', 'source-output');
      output.hidden = true;
      const generate = element('button', 'Gerar JSON e instrução CLI', 'btn btn-primary');
      generate.type = 'submit';
      const copyJson = element('button', 'Copiar JSON', 'btn btn-secondary');
      copyJson.type = 'button';
      const copyCommand = element('button', 'Copiar instrução CLI', 'btn btn-secondary');
      copyCommand.type = 'button';
      const cancel = element('button', 'Fechar', 'btn btn-secondary');
      cancel.type = 'button';
      cancel.addEventListener('click', () => form.remove());
      form.append(generate, copyJson, copyCommand, cancel, output);

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const source = { id: inputs.id.value.trim(), path: inputs.path.value.trim(), kind: kind.value, role: role.value };
        for (const field of ['stack', 'scope', 'description']) {
          if (inputs[field].value.trim()) source[field] = inputs[field].value.trim();
        }
        if (!source.id || !source.path) {
          output.hidden = false;
          output.textContent = 'Informe o identificador e o caminho relativo da fonte.';
          return;
        }
        const json = JSON.stringify(source, null, 2);
        output.dataset.json = json;
        output.dataset.command = `smith sources add --run-id ${runId} < source.json`;
        output.hidden = false;
        output.textContent = `${json}\n\n${output.dataset.command}`;
      });
      copyJson.addEventListener('click', () => copySourceText(output, 'json'));
      copyCommand.addEventListener('click', () => copySourceText(output, 'command'));
      section.append(form);
    }

    function copySourceText(output, field) {
      const text = output.dataset[field];
      if (!text) return;
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.append(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        notice.textContent = field === 'json' ? 'JSON copiado para a área de transferência.' : 'Instrução CLI copiada.';
      } catch (error) {
        notice.textContent = `Não foi possível copiar: ${error.message}`;
      } finally {
        textarea.remove();
      }
    }

    function render(state, defaultOpen = false) {
      validateState(state);
      const overview = element('section', '', 'overview');
      const heading = element('div', '', 'overview-heading');
      const h2 = element('h2', 'Iniciativa: ');
      h2.append(element('span', state.runId, 'run-id-tag'));
      heading.append(h2, renderSourcesSection(state));
      overview.append(heading);

      const metrics = element('div', '', 'metrics-row');
      const metricStatuses = ['COMPLETED', 'RUNNING', 'PENDING', 'FAILED'].map((key) => stepStatuses[key]);
      for (const definition of metricStatuses) {
        const count = state.nodes.flatMap((node) => node.steps.map((step) => step.status))
          .filter((status) => status === definition.value).length;
        const metric = element('div', '', `metric ${definition.className}`);

        const titleGroup = element('div', '', 'metric-title-group');
        const icon = element('div', '', `metric-icon ${definition.className}`);
        const iconPaths = {
          done: 'M5.5 10.5l3 3 6-6.5',
          active: 'M10 3v3M10 14v3M3 10h3M14 10h3M5.1 5.1l2.1 2.1M12.8 12.8l2.1 2.1',
          waiting: 'M10 6v4l2.5 2M10 17.5a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z',
          error: 'M10 6.5v4M10 13.5h.01M3.2 16.5L10 3.5l6.8 13H3.2Z',
        };
        icon.append(svgIcon(iconPaths[definition.className] || iconPaths.waiting));
        titleGroup.append(icon, element('span', definition.label, 'metric-label'));

        const valueEl = element('strong', String(count), 'metric-value');
        metric.append(titleGroup, valueEl);
        metrics.append(metric);
      }
      overview.append(metrics);
      content.append(overview);

      for (const [idx, node] of state.nodes.entries()) {
        const theme = element('section', '', 'theme');
        const shouldOpen = defaultOpen && idx === 0;
        if (shouldOpen) theme.classList.add('open');

        const header = element('div', '', 'theme-header');
        header.setAttribute('role', 'button');
        header.setAttribute('tabindex', '0');
        header.setAttribute('aria-expanded', String(shouldOpen));

        const left = element('div', '', 'theme-header-left');
        left.append(
          element('h2', node.tema),
          element('p', shouldOpen ? 'Selecione uma etapa para consultar seus artefatos' : 'Clique para expandir o fluxo')
        );

        const badge = element('span', 'TEMA', 'theme-badge');
        const chevron = element('span', '', 'theme-chevron');
        chevron.append(svgIcon('M5 8l5 5 5-5'));
        const right = element('div', '', 'theme-header-right');
        right.append(badge, chevron);

        header.append(left, right);
        const toggle = () => {
          const open = theme.classList.toggle('open');
          header.setAttribute('aria-expanded', String(open));
          left.children[1].textContent = open
            ? 'Selecione uma etapa para consultar seus artefatos'
            : 'Clique para expandir o fluxo';
        };
        header.addEventListener('click', toggle);
        header.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggle();
          }
        });
        theme.append(header, diagram(node));
        content.append(theme);
      }
    }

    function validArtifactPath(path) {
      return typeof path === 'string' && path.startsWith('workspace/') &&
        !path.includes('\\') && !path.includes(':') &&
        path.split('/').every((part) => part && part !== '.' && part !== '..' && !part.includes('\0'));
    }

    async function artifactFile(path) {
      if (!validArtifactPath(path)) throw new Error('Caminho inválido do artefato.');
      if (projectFiles) {
        const file = projectFiles.get(path);
        if (!file) throw new Error('Artefato não encontrado na pasta selecionada.');
        return file;
      }
      if (!project && demoArtifactsContent.has(path)) {
        return { text: async () => demoArtifactsContent.get(path) };
      }
      if (!project) throw new Error('Autorize a pasta raiz do projeto para ler os artefatos.');
      const parts = path.split('/');
      let current = project;
      for (const part of parts.slice(0, -1)) current = await current.getDirectoryHandle(part);
      return (await current.getFileHandle(parts.at(-1))).getFile();
    }

    function closeDetails() {
      detailSequence += 1;
      details.hidden = true;
      overlay.hidden = true;
    }

    function renderArtifact(name, artifact, sequence, loads) {
      const item = element('div', '', 'artifact open');
      const header = element('div', '', 'artifact-header');
      header.append(element('strong', name), element('span', artifact.path, 'artifact-path'));
      if (artifact.groupId) header.append(element('span', `Publicação: ${artifact.groupId}`, 'artifact-group'));
      const chevron = element('span', '', 'artifact-chevron');
      chevron.append(svgIcon('M5 8l5 5 5-5'));
      header.append(chevron);
      header.addEventListener('click', () => item.classList.toggle('open'));
      const body = element('div', '', 'artifact-body');
      const output = element('div', 'Carregando artefato…', 'artifact-loading');
      body.append(output);
      item.append(header, body);
      loads.push((async () => {
        try {
          const file = await artifactFile(artifact.path);
          const text = await file.text();
          if (sequence !== detailSequence) return;
          output.textContent = '';
          output.append(artifact.path.toLowerCase().endsWith('.md') ? renderMarkdown(text) : element('pre', text));
        } catch (error) {
          if (sequence === detailSequence) {
            output.className = 'artifact-error';
            output.textContent = `Não foi possível ler o artefato: ${error.message}`;
          }
        }
      })());
      return item;
    }

    async function showDetails(node, definition) {
      const sequence = ++detailSequence;
      const selectedNode = findNode(currentStateObj, node.id);
      const state = findStep(selectedNode, definition.id);
      details.textContent = '';
      details.hidden = false;
      overlay.hidden = false;
      const topbar = element('div', '', 'details-topbar');
      const close = element('button', 'Fechar', 'btn btn-secondary');
      close.type = 'button';
      close.addEventListener('click', closeDetails);
      topbar.append(element('h2', labels[definition.id] || definition.id), close);
      details.append(topbar);
      overlay.addEventListener('click', closeDetails, { once: true });

      const scroll = element('div', '', 'details-scroll');
      const meta = element('div', '', 'detail-meta-row');
      meta.append(element('span', node.tema, 'detail-chip'), statusBadge(state.status));
      meta.append(element('span', definition.requires.length
        ? `Depende de: ${definition.requires.map((id) => labels[id] || id).join(', ')}`
        : 'Sem dependências', 'detail-chip'));
      scroll.append(meta);

      if (state.error) {
        scroll.append(element('div', `Erro do engine: ${state.error}`, 'engine-error-banner'));
      }

      const artifacts = state.artifacts.map((artifact) => [artifact.name, artifact]);
      for (const approved of state.approvedArtifacts || []) {
        for (const artifact of approved.artifacts) artifacts.push([`${approved.stepType} — ${artifact.name}`, artifact]);
      }

      if (artifacts.length || !state.items.length) {
        scroll.append(element('div', 'Artefatos', 'artifacts-heading'));
        const loads = [];
        for (const [name, artifact] of artifacts) {
          const card = renderArtifact(name, artifact, sequence, loads);
          scroll.append(card);
        }
        if (!artifacts.length) scroll.append(element('div', 'Nenhum artefato registrado nesta etapa.', 'empty-artifacts'));
        await Promise.all(loads);
      }

      if (state.items.length) {
        const items = element('section', '', 'items-section');
        items.append(element('div', 'Itens', 'artifacts-heading'));
        const loads = [];
        for (const item of state.items) {
          const card = element('article', '', 'item-card');
          const heading = element('div', '', 'item-header');
          heading.append(statusBadge(item.status), element('span', item.label, 'item-label'));
          const body = element('div', '', 'item-body');
          for (const artifact of item.artifacts) body.append(renderArtifact(artifact.name, artifact, sequence, loads));
          if (!item.artifacts.length) body.append(element('p', 'Nenhum artefato registrado.'));
          card.append(heading, body);
          items.append(card);
        }
        scroll.append(items);
        await Promise.all(loads);
      }

      details.append(scroll);
    }

    function renderInline(parent, text) {
      const tokens = /(`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|_[^_\n]+_|!?\[[^\]\n]+\]\([^)\n]+\))/g;
      let offset = 0;
      for (const match of text.matchAll(tokens)) {
        parent.append(document.createTextNode(text.slice(offset, match.index)));
        const token = match[0];
        if (token.startsWith('`')) parent.append(element('code', token.slice(1, -1)));
        else if (token.startsWith('**') || token.startsWith('__')) parent.append(element('strong', token.slice(2, -2)));
        else if (token.startsWith('*') || token.startsWith('_')) parent.append(element('em', token.slice(1, -1)));
        else if (token.startsWith('[')) parent.append(element('span', token.slice(1, token.indexOf(']'))));
        else parent.append(document.createTextNode(token));
        offset = match.index + token.length;
      }
      parent.append(document.createTextNode(text.slice(offset)));
    }

    function renderMarkdown(text) {
      const result = element('div', '', 'markdown');
      const lines = text.replace(/\r\n?/g, '\n').split('\n');
      const tableCells = (line) => line.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((cell) => cell.trim().replace(/\\\|/g, '|'));
      const isTableRule = (line) => /^\s*\|?\s*:?-{3,}/.test(line) &&
        tableCells(line).every((cell) => /^:?-{3,}:?$/.test(cell));
      const isBlock = (line) => /^\s*(#{1,6}\s|```|~~~|>|[-*+]\s|\d+[.)]\s)/.test(line);
      let index = 0;
      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) { index += 1; continue; }
        const fence = /^\s*(`{3,}|~{3,})/.exec(line);
        if (fence) {
          index += 1;
          const code = [];
          while (index < lines.length && !lines[index].trim().startsWith(fence[1])) code.push(lines[index++]);
          if (index < lines.length) index += 1;
          const pre = element('pre', '');
          pre.append(element('code', code.join('\n')));
          result.append(pre);
          continue;
        }
        const heading = /^\s*(#{1,6})\s+(.+?)\s*#*\s*$/.exec(line);
        if (heading) {
          const title = element(`h${heading[1].length}`, '');
          renderInline(title, heading[2]); result.append(title); index += 1; continue;
        }
        if (index + 1 < lines.length && line.includes('|') && isTableRule(lines[index + 1])) {
          const table = element('table', ''), head = element('thead', ''), row = element('tr', '');
          for (const cell of tableCells(line)) { const th = element('th', ''); renderInline(th, cell); row.append(th); }
          head.append(row); table.append(head);
          const body = element('tbody', '');
          index += 2;
          while (index < lines.length && lines[index].trim() && lines[index].includes('|')) {
            const tr = element('tr', '');
            for (const cell of tableCells(lines[index++])) { const td = element('td', ''); renderInline(td, cell); tr.append(td); }
            body.append(tr);
          }
          table.append(body); result.append(table); continue;
        }
        const list = /^\s*([-*+]|\d+[.)])\s+(.+)$/.exec(line);
        if (list) {
          const ordered = /^\d/.test(list[1]);
          const listElement = element(ordered ? 'ol' : 'ul', '');
          while (index < lines.length) {
            const item = /^\s*([-*+]|\d+[.)])\s+(.+)$/.exec(lines[index]);
            if (!item || /^\d/.test(item[1]) !== ordered) break;
            const listItem = element('li', '');
            renderInline(listItem, item[2]);
            listElement.append(listItem);
            index += 1;
          }
          result.append(listElement); continue;
        }
        if (/^\s*>/.test(line)) {
          const quote = element('blockquote', '');
          const parts = [];
          while (index < lines.length && /^\s*>/.test(lines[index])) parts.push(lines[index++].replace(/^\s*>\s?/, ''));
          renderInline(quote, parts.join('\n')); result.append(quote); continue;
        }
        const paragraph = element('p', '');
        const parts = [lines[index++]];
        while (index < lines.length && lines[index].trim() && !isBlock(lines[index]) &&
          !(index + 1 < lines.length && lines[index].includes('|') && isTableRule(lines[index + 1]))) {
          parts.push(lines[index++]);
        }
        renderInline(paragraph, parts.join('\n')); result.append(paragraph);
      }
      return result;
    }

    function getLastInitiative() {
      try { return localStorage.getItem(lastInitiativeKey); }
      catch (_) { return null; }
    }

    function rememberInitiative(name) {
      try { localStorage.setItem(lastInitiativeKey, name); }
      catch (_) {}
    }

    async function readFile(file, sequence = ++loadSequence) {
      message.textContent = '';
      content.textContent = '';
      details.hidden = true;
      overlay.hidden = true;
      detailSequence += 1;
      try {
        const state = JSON.parse(await file.text());
        validateState(state);
        if (sequence === loadSequence) {
          currentStateObj = state;
          render(state, true);
        }
      } catch (error) {
        if (sequence !== loadSequence) return;
        content.textContent = '';
        message.textContent = `Não foi possível ler o arquivo: JSON ou estado inválido. ${error.message}`;
      }
    }

    async function selectInitiative() {
      const file = files.find((item) => item.name === initiative.value);
      if (!file) return;
      const sequence = ++loadSequence;
      rememberInitiative(file.name);
      try {
        const selected = await file.getFile();
        if (sequence === loadSequence) await readFile(selected, sequence);
      } catch (error) {
        if (sequence !== loadSequence) return;
        content.textContent = '';
        message.textContent = `Não foi possível abrir ${file.name}: ${error.message}`;
      }
    }

    async function showFiles(items, folderName) {
      files = items.filter((item) => /\.json$/i.test(item.name)).sort((a, b) => a.name.localeCompare(b.name));
      initiative.textContent = '';
      content.textContent = '';
      message.textContent = '';
      details.hidden = true;
      overlay.hidden = true;
      detailSequence += 1;
      loadSequence += 1;
      initiative.disabled = files.length === 0;
      if (!files.length) {
        initiative.append(element('option', 'Nenhum JSON encontrado'));
        notice.textContent = `Nenhum arquivo JSON encontrado em ${folderName}.`;
        return;
      }
      for (const file of files) {
        const option = element('option', file.name);
        option.value = file.name;
        initiative.append(option);
      }
      notice.textContent = '';
      const last = getLastInitiative();
      initiative.value = files.some((file) => file.name === last) ? last : files[0].name;
      await selectInitiative();
    }

    async function readDirectory(handle) {
      let runs = handle;
      try {
        for (const part of ['.smith', 'runs']) runs = await runs.getDirectoryHandle(part);
      } catch (error) {
        throw new Error(`Projeto inválido: pasta de execuções indisponível. ${error.message}`, { cause: error });
      }
      const items = [];
      for await (const entry of runs.values()) {
        if (entry.kind === 'file') {
          const entryName = entry.name;
          items.push({ name: entryName, getFile: async () => (await runs.getFileHandle(entryName)).getFile() });
        }
      }
      directory = handle;
      project = handle;
      projectFiles = undefined;
      refreshFolder.hidden = false;
      restoreFolder.hidden = true;
      await showFiles(items, handle.name);
    }

    function storedDirectory(mode, value, key = 'project-root') {
      return new Promise((resolve, reject) => {
        const opening = indexedDB.open('smith-viewer', 1);
        opening.onupgradeneeded = () => {
          if (!opening.result.objectStoreNames.contains('preferences')) opening.result.createObjectStore('preferences');
        };
        opening.onerror = () => reject(opening.error);
        opening.onsuccess = () => {
          const transaction = opening.result.transaction('preferences', mode === 'get' ? 'readonly' : 'readwrite');
          const store = transaction.objectStore('preferences');
          const request = mode === 'get' ? store.get(key) : store.put(value, key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        };
      });
    }

    chooseFolder.addEventListener('click', async () => {
      if (typeof showDirectoryPicker !== 'function') {
        folderInput.click();
        return;
      }
      try {
        const handle = await showDirectoryPicker({ mode: 'read' });
        await readDirectory(handle);
        try { await storedDirectory('put', handle); }
        catch (error) { notice.textContent += ` Não foi possível lembrar a pasta: ${error.message}`; }
      } catch (error) {
        if (error.name !== 'AbortError') message.textContent = `Não foi possível abrir a pasta: ${error.message}`;
      }
    });

    folderInput.addEventListener('change', async () => {
      const selected = Array.from(folderInput.files);
      folderInput.value = '';
      if (!selected.length) return;
      const root = selected[0].webkitRelativePath.split('/')[0];
      const prefix = '.smith/runs/';
      if (!root || selected.some((file) => file.webkitRelativePath.split('/')[0] !== root)) {
        message.textContent = 'Projeto inválido: selecione uma única raiz de projeto.';
        return;
      }
      const entries = selected.map((file) => [file.webkitRelativePath.split('/').slice(1).join('/'), file]);
      const runs = entries.filter(([path]) => path.startsWith(prefix) && !path.slice(prefix.length).includes('/'));
      if (!runs.length) {
        message.textContent = 'Projeto inválido: pasta de execuções não encontrada ou vazia.';
        return;
      }
      directory = undefined;
      project = undefined;
      projectFiles = new Map(entries);
      refreshFolder.hidden = true;
      restoreFolder.hidden = true;
      await showFiles(runs.map(([, file]) => ({ name: file.name, getFile: async () => file })), root);
      notice.textContent += ' Para atualizar ou reabrir, selecione o projeto novamente.';
    });

    restoreFolder.addEventListener('click', async () => {
      try {
        if (await directory.requestPermission({ mode: 'read' }) !== 'granted') {
          message.textContent = 'Permissão de leitura para a pasta não concedida.';
          return;
        }
        await readDirectory(directory);
      } catch (error) { message.textContent = `Não foi possível reabrir a pasta: ${error.message}`; }
    });

    refreshFolder.addEventListener('click', async () => {
      try { await readDirectory(directory); }
      catch (error) { message.textContent = `Não foi possível atualizar a pasta: ${error.message}`; }
    });

    initiative.addEventListener('change', selectInitiative);

    // Inicializa com o Preview interativo imediatamente se nenhum diretório local estiver carregado
    function initDemoPreview() {
      currentStateObj = demoState;
      initiative.textContent = '';
      const opt = element('option', 'motor-de-recorrencia.json');
      opt.value = 'motor-de-recorrencia.json';
      initiative.append(opt);
      initiative.disabled = false;
      refreshFolder.hidden = false;
      render(demoState, true);
    }

    initDemoPreview();

    if (typeof showDirectoryPicker === 'function' && typeof indexedDB !== 'undefined') {
      storedDirectory('get').then(async (handle) => {
        if (!handle) return;
        directory = handle;
        if (await handle.queryPermission({ mode: 'read' }) === 'granted') {
          await readDirectory(handle);
        } else {
          restoreFolder.hidden = false;
          notice.textContent = `Autorize o acesso para reabrir o projeto ${handle.name}.`;
        }
      }).catch(() => {});
    }
  </script>
</body>
</html>
